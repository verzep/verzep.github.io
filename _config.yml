#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: Pietro Verzelli
# Same as name; used by jekyll-seo-tag, jekyll-feed and github-metadata
title: Pietro Verzelli

# Short bio or description (displayed in the header)
description: Senior Research Fellow in Computational Neuroscience

# Affiliation, shown under the name on the home page
affiliation: Zimmer Lab, University of Vienna

# URL of your avatar or profile pic (you could use your GitHub profile pic)
avatar: https://avatars.githubusercontent.com/u/33346242?v=4

# Profile IDs for the home-page link row and the footer icons (_includes/profile-links.html,
# _includes/social-links.html). A key left empty hides its link.
profiles:
  google_scholar: 90ff92UAAAAJ   # the user=... value of the Google Scholar profile URL
  orcid: 0000-0003-4470-7182
  github: verzep
  linkedin: pietro-verzelli-809939142
  bluesky:          # handle, e.g. name.bsky.social

# Enter your Disqus shortname (not your username) to enable commenting on posts
# You can find your shortname on the Settings page of your Disqus account
disqus:

# Your website URL (e.g. http://barryclark.github.io or http://www.barryclark.co)
# Used for Sitemap.xml and your RSS feed
url: https://verzep.github.io

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl: ""

#
# !! You don't need to change any of the configuration flags below !!
#

permalink: /:title/

# The release of Jekyll Now that you're using
version: v1.2.0

highlighter: rouge
markdown:    kramdown

# Set the Sass partials directory, as we're using @imports
sass:
  style: :expanded # You might prefer to minify using :compressed

# Use the following plug-ins (all whitelisted on GitHub Pages)
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem
  - jekyll-seo-tag # <title>-independent meta tags: description, canonical, Open Graph, Twitter card

# jekyll-seo-tag
author:
  name: Pietro Verzelli
  twitter: FascinoMaligno
twitter:
  username: FascinoMaligno
  card: summary_large_image
social:
  name: Pietro Verzelli
  links:
    - https://github.com/verzep
    - https://www.linkedin.com/in/pietro-verzelli-809939142

defaults:
  # Social preview (og:image / twitter:image): a 1200x630 card made from images/propic.jpg.
  # Posts with a lead figure override it with `image:` in their front matter.
  - scope:
      path: ""
    values:
      image: /images/og-card.jpg
  # Unrelated to the academic site: keep the pages but leave them out of the sitemap
  - scope:
      path: "vino"
    values:
      sitemap: false
  - scope:
      path: "R-BCM.html"
    values:
      sitemap: false

# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - LICENSE-content
  - README.md
  - CNAME
  - CLAUDE.md
